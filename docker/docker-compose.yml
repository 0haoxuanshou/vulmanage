version: '3.8'

services:
  postgres:
    image: registry.cn-shanghai.aliyuncs.com/bountyteam/postgres:17
    container_name: vulmanage_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}          # 数据库用户名
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # 数据库密码
      POSTGRES_DB: ${DB_NAME}        # 默认数据库
    ports:
      - "5432:5432"                   # 映射端口
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vulmanage-network

  minio:
    image: registry.cn-shanghai.aliyuncs.com/bountyteam/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: vulmanage_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}        # MinIO 管理账号
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}    # MinIO 管理密码
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web 管理界面
    volumes:
      - minio_data:/data
    networks:
      - vulmanage-network

  backend:
    image: registry.cn-shanghai.aliyuncs.com/bountyteam/vul_be:1.0
    container_name: vulmanage_backend
    restart: always
    environment:
      DB_URL: ${DB_URL}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET_NAME}
      VULN_PREFIX: ${VULN_PREFIX}
      LOG_LEVEL: ${LOG_LEVEL}
      SECURITY_LOG_LEVEL: WARN
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
    networks:
      - vulmanage-network

  frontend:
    image: registry.cn-shanghai.aliyuncs.com/bountyteam/vul_fe:1.0
    container_name: vulmanage_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vulmanage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  vulmanage-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  minio_data: